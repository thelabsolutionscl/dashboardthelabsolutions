name: Verify Access rollout (read-only)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Reportes preflight or before/after SII cutover
        required: true
        type: choice
        default: before
        options:
          - reportes
          - before
          - post

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read-only Access and SII readiness probes
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          PREFLIGHT_CF_CLIENT_ID: ${{ secrets.PREFLIGHT_CF_CLIENT_ID }}
          PREFLIGHT_CF_CLIENT_SECRET: ${{ secrets.PREFLIGHT_CF_CLIENT_SECRET }}
          SII_WORKER_KEY: ${{ secrets.SII_WORKER_KEY }}
          SII_ACCESS_MODE: ${{ vars.SII_ACCESS_MODE }}
          STAGE: ${{ inputs.stage }}
        run: node scripts/access-readiness.mjs
