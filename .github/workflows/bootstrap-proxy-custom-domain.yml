name: Bootstrap proxy custom domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-proxy-custom-domain.yml'

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Attach proxy.thelab.solutions to airtable-proxy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          host="proxy.thelab.solutions"
          service="airtable-proxy"

          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Cloudflare credentials missing"
            exit 1
          fi

          curl -fsS "${auth[@]}" "$api/zones?name=thelab.solutions" -o /tmp/zones.json
          zone=$(python3 - <<'PY'
import json
d=json.load(open('/tmp/zones.json'))
rows=d.get('result') or []
if len(rows)!=1:
    raise SystemExit(1)
print(rows[0]['id'])
PY
          ) || { echo "::error::Unable to resolve unique Cloudflare zone"; exit 1; }

          curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT/workers/domains" -o /tmp/domains.json
          current=$(python3 - <<'PY'
import json
d=json.load(open('/tmp/domains.json'))
for row in d.get('result') or []:
    if row.get('hostname')=='proxy.thelab.solutions':
        print(row.get('service',''))
        break
PY
          )

          if [ -n "$current" ]; then
            if [ "$current" != "$service" ]; then
              echo "::error::$host is already attached to another Worker"
              exit 1
            fi
            echo "$host is already attached to $service; no change."
          else
            payload=$(python3 - "$zone" <<'PY'
import json,sys
print(json.dumps({
  "hostname":"proxy.thelab.solutions",
  "service":"airtable-proxy",
  "zone_id":sys.argv[1],
  "zone_name":"thelab.solutions"
}))
PY
            )
            code=$(curl -sS -o /tmp/attach.json -w '%{http_code}' -X PUT "${auth[@]}"               "$api/accounts/$CF_ACCOUNT/workers/domains" -d "$payload")
            success=$(python3 -c 'import json; d=json.load(open("/tmp/attach.json")); print(str(bool(d.get("success"))).lower())' 2>/dev/null || echo false)
            if [ "$code" != "200" ] || [ "$success" != "true" ]; then
              errors=$(python3 -c 'import json; d=json.load(open("/tmp/attach.json")); print("; ".join(str(x.get("message","")) for x in d.get("errors",[])))' 2>/dev/null || true)
              echo "::error::Cloudflare custom-domain attach failed (HTTP $code): ${errors:-unknown error}"
              exit 1
            fi
            echo "$host attached to $service."
          fi

          # Cloudflare may need a short interval for DNS/certificate propagation.
          ok=false
          for i in $(seq 1 18); do
            if python3 - <<'PY'
import socket
socket.getaddrinfo("proxy.thelab.solutions",443)
PY
            then
              status=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 8 "https://proxy.thelab.solutions/health" || true)
              if [ "$status" = "200" ]; then
                ok=true
                echo "DNS + HTTPS health ready."
                break
              fi
            fi
            sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "::warning::Domain attached, but DNS/TLS health is still propagating. Re-run readiness after propagation."
          fi
