name: Auditoría Clientes

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/clientes-wiring.test.js'
      - '.github/workflows/clientes-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/clientes-wiring.test.js'
      - '.github/workflows/clientes-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clientes-wiring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar sintaxis del dashboard
        run: |
          node --check tests/clientes-wiring.test.js
          for file in js/*.js; do node --check "$file"; done

      - name: Auditar sección Clientes
        run: node --test tests/clientes-wiring.test.js

      - name: Ejecutar smoke test general
        run: node tests/smoke.test.js
