name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite lanzar el deploy a mano desde la pestaña Actions
  # redeploy manual solicitado 2026-09-21
  # Nota: tras crear/cambiar un secret (PROXY_URL, PROXY_KEY, ADS_WEBAPP…), hay que
  # relanzar este deploy para re-hornear los valores nuevos en index.html.

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE }}       # el secret se llama AIRTABLE
          OPENAI_KEY: ${{ secrets.OPENAI }}             # el secret se llama OPENAI
          GOOGLE_CLIENT_ID: ${{ secrets.DRIVE }}        # el secret se llama DRIVE
          SII_WORKER_URL: ${{ secrets.SII_WORKER_URL }}
          SII_WORKER_KEY: ${{ secrets.SII_WORKER_KEY }}   # clave del worker tributario (ver sii-worker)
          SII_RUT_EMISOR: ${{ secrets.SII_RUT_EMISOR }}
          SII_RAZON_SOCIAL: ${{ secrets.SII_RAZON_SOCIAL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          PRINTER_TUNNEL: ${{ secrets.PRINTER_TUNNEL }}
          ADS_WEBAPP: ${{ secrets.ADS_WEBAPP }}
          ADS_CUSTOMER: ${{ secrets.ADS_CUSTOMER }}
          ELEVENLABS: ${{ secrets.ELEVENLABS }}
          PRINTER_TUNNEL_TOKEN: ${{ secrets.PRINTER_TUNNEL_TOKEN }}
          LEAD_WORKER_URL: ${{ secrets.LEAD_WORKER_URL }}
          PUBLIC_LEAD_KEY: ${{ secrets.PUBLIC_LEAD_KEY }}
          PORTAL_ADMIN_KEY: ${{ secrets.PORTAL_ADMIN_KEY }}
        run: |
          # MODO PROXY (ver SECURITY.md): con PROXY_URL+PROXY_KEY configurados,
          # Airtable y Claude salen por Workers. Anthropic NO tiene placeholder,
          # fallback ni API key local en el HTML.
          if [ -n "${PROXY_URL}" ] && [ -n "${PROXY_KEY}" ]; then
            echo "Modo proxy activo: Claude sólo usa airtable-proxy."
          else
            sed -i "s|%%AIRTABLE_TOKEN%%|${AIRTABLE_TOKEN}|g" index.html
            echo "::warning::PROXY_URL/PROXY_KEY faltan — Claude quedará bloqueado."
          fi
          sed -i "s|%%OPENAI_KEY%%|${OPENAI_KEY}|g" index.html
          sed -i "s|%%GOOGLE_CLIENT_ID%%|${GOOGLE_CLIENT_ID}|g" index.html
          # Portal del cliente: lo sirve el lead-worker. El dashboard solo necesita
          # su URL y PORTAL_ADMIN_KEY para pedir el link firmado de cada cliente.
          if [ -n "${LEAD_WORKER_URL}" ]; then sed -i "s|%%LEAD_WORKER_URL%%|${LEAD_WORKER_URL}|g" index.html; fi
          if [ -n "${PUBLIC_LEAD_KEY}" ]; then sed -i "s|%%PUBLIC_LEAD_KEY%%|${PUBLIC_LEAD_KEY}|g" index.html; fi
          if [ -n "${PORTAL_ADMIN_KEY}" ]; then sed -i "s|%%PORTAL_ADMIN_KEY%%|${PORTAL_ADMIN_KEY}|g" index.html; fi
          sed -i "s|%%SII_WORKER_URL%%|${SII_WORKER_URL}|g" index.html
          if [ -n "${SII_WORKER_KEY}" ]; then sed -i "s|%%SII_WORKER_KEY%%|${SII_WORKER_KEY}|g" index.html; fi
          sed -i "s|%%SII_RUT_EMISOR%%|${SII_RUT_EMISOR}|g" index.html
          sed -i "s|%%SII_RAZON_SOCIAL%%|${SII_RAZON_SOCIAL}|g" index.html
          sed -i "s|%%PROXY_URL%%|${PROXY_URL}|g" index.html
          sed -i "s|%%PROXY_KEY%%|${PROXY_KEY}|g" index.html
          sed -i "s|%%PRINTER_TUNNEL%%|${PRINTER_TUNNEL}|g" index.html
          sed -i "s|%%ADS_WEBAPP%%|${ADS_WEBAPP}|g" index.html
          sed -i "s|%%ADS_CUSTOMER%%|${ADS_CUSTOMER}|g" index.html
          sed -i "s|%%ELEVENLABS%%|${ELEVENLABS}|g" index.html
          sed -i "s|%%PRINTER_TUNNEL_TOKEN%%|${PRINTER_TUNNEL_TOKEN}|g" index.html

      - name: Inject secrets into cotiza.html (cotizador público)
        env:
          LEAD_WORKER_URL: ${{ secrets.LEAD_WORKER_URL }}
          PUBLIC_LEAD_KEY: ${{ secrets.PUBLIC_LEAD_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          # Sin secrets configurados, los %%…%% quedan y el formulario cae a mailto: — no se rompe.
          if [ -n "${LEAD_WORKER_URL}" ]; then sed -i "s|%%LEAD_WORKER_URL%%|${LEAD_WORKER_URL}|g" cotiza.html; fi
          if [ -n "${PUBLIC_LEAD_KEY}" ]; then sed -i "s|%%PUBLIC_LEAD_KEY%%|${PUBLIC_LEAD_KEY}|g" cotiza.html; fi
          if [ -n "${TURNSTILE_SITE_KEY}" ]; then sed -i "s|%%TURNSTILE_SITE_KEY%%|${TURNSTILE_SITE_KEY}|g" cotiza.html; fi

      - name: Stamp build version (cache-busting de styles.css, js/* y service worker)
        run: sed -i "s|%%BUILD%%|${GITHUB_SHA::8}|g" index.html sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Recuperación puntual: un deploy de Pages cancelado puede quedar
      # retenido server-side y bloquear todos los siguientes con HTTP 400.
      # Cancelamos el Pages deployment y eliminamos SOLO los deployments
      # estándar asociados al SHA atascado en el entorno github-pages.
      - name: Clear stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_SHA: 19cf5c537e6b2503241088aaae03cbd1636dd686
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' -H "Authorization: Bearer ${GH_TOKEN}")

          status=$(curl -sS -o /tmp/pages-cancel-response -w '%{http_code}' -X POST "${headers[@]}" \
            "${api}/pages/deployments/${STALE_SHA}/cancel")
          if [ "$status" = 204 ]; then
            echo 'Pages deployment atascado cancelado'
          elif [ "$status" = 404 ]; then
            echo 'Pages deployment atascado ya no existe'
          else
            cat /tmp/pages-cancel-response
            exit 1
          fi

          curl -sS "${headers[@]}" \
            "${api}/deployments?sha=${STALE_SHA}&environment=github-pages&per_page=100" \
            -o /tmp/stale-deployments.json

          python3 -c 'import json; data=json.load(open("/tmp/stale-deployments.json")); print("\n".join(str(dep["id"]) for dep in data if dep.get("sha")=="19cf5c537e6b2503241088aaae03cbd1636dd686" and dep.get("environment")=="github-pages"))' > /tmp/stale-deployment-ids

          while read -r deployment_id; do
            [ -n "$deployment_id" ] || continue
            code=$(curl -sS -o /tmp/deployment-status-response -w '%{http_code}' -X POST "${headers[@]}" \
              "${api}/deployments/${deployment_id}/statuses" \
              -d '{"state":"inactive","description":"Cleared stale GitHub Pages deployment"}')
            if [ "$code" != 201 ] && [ "$code" != 422 ]; then
              cat /tmp/deployment-status-response
              exit 1
            fi

            code=$(curl -sS -o /tmp/deployment-delete-response -w '%{http_code}' -X DELETE "${headers[@]}" \
              "${api}/deployments/${deployment_id}")
            if [ "$code" = 204 ] || [ "$code" = 404 ]; then
              echo "Deployment estándar ${deployment_id} liberado"
            else
              cat /tmp/deployment-delete-response
              exit 1
            fi
          done </tmp/stale-deployment-ids

          # Pages tarda unos segundos en soltar el lock aun después del cleanup.
          sleep 10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
