name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check JavaScript
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const html=fs.readFileSync("index.html","utf8");
            const re=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
            let m,i=0,bad=0;
            while((m=re.exec(html))){
              const head=m[0].slice(0,m[0].indexOf(">"));
              if(/\bsrc\s*=/.test(head)) continue;
              i++; fs.writeFileSync("/tmp/b"+i+".js",m[1]);
              try{ require("child_process").execFileSync("node",["--check","/tmp/b"+i+".js"],{stdio:"pipe"}); }
              catch(e){ bad++; console.error("Bloque inline "+i+" inválido\n"+(e.stderr||e.stdout||e)); }
            }
            process.exit(bad?1:0);
          '
          for file in js/*.js scripts/*.mjs; do node --check "$file"; done

      - name: Run all tests
        run: node --test tests/*.test.js

      - name: PHP lint
        run: php -l mail-api.php

  deploy:
    name: Deploy GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inyectar solo configuración pública
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.DRIVE }}
          SII_WORKER_URL: ${{ secrets.SII_WORKER_URL }}
          SII_RUT_EMISOR: ${{ secrets.SII_RUT_EMISOR }}
          SII_RAZON_SOCIAL: ${{ secrets.SII_RAZON_SOCIAL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PRINTER_TUNNEL: ${{ secrets.PRINTER_TUNNEL }}
          ADS_WEBAPP: ${{ secrets.ADS_WEBAPP }}
          ADS_CUSTOMER: ${{ secrets.ADS_CUSTOMER }}
          LEAD_WORKER_URL: ${{ secrets.LEAD_WORKER_URL }}
          PUBLIC_LEAD_KEY: ${{ secrets.PUBLIC_LEAD_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: node scripts/inject-public-config.mjs

      - name: Stamp build version
        run: |
          set -euo pipefail
          sed -i "s|%%BUILD%%|${GITHUB_SHA::8}|g" index.html sw.js

      - name: Construir artifact público mínimo
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          rsync -a ./ dist/ \
            --exclude dist \
            --exclude .git \
            --exclude .github \
            --exclude '.*' \
            --exclude tests \
            --exclude scripts \
            --exclude docs \
            --exclude backup \
            --exclude airtable-proxy \
            --exclude lead-worker \
            --exclude sii-worker \
            --exclude printer-bridge \
            --exclude node_modules \
            --exclude mail-api.php \
            --exclude SECURITY.md \
            --exclude '*.md' \
            --exclude '*.log'
          test -s dist/index.html
          test -s dist/sw.js

      - name: Verificar artifact antes de publicar
        run: |
          set -euo pipefail
          if grep -RIlE 'sk-ant-[A-Za-z0-9_-]{15,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|pat[A-Za-z0-9._-]{20,}|re_[A-Za-z0-9_-]{20,}' dist/index.html dist/cotiza.html 2>/dev/null; then
            echo '::error::Se detectó una posible credencial privada en el artifact público'
            exit 1
          fi
          if grep -qE '%%(AIRTABLE_TOKEN|ANTHROPIC_KEY|OPENAI_KEY|ELEVENLABS|PROXY_KEY|PRINTER_TUNNEL_TOKEN|PORTAL_ADMIN_KEY)%%' dist/index.html; then
            echo '::error::Quedaron placeholders privados en index.html'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
