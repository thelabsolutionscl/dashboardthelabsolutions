name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite lanzar el deploy a mano desde la pestaña Actions
  # redeploy manual solicitado 2026-09-21
  # Nota: tras crear/cambiar un secret (PROXY_URL, PROXY_KEY, ADS_WEBAPP…), hay que
  # relanzar este deploy para re-hornear los valores nuevos en index.html.

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.DRIVE }}        # el secret se llama DRIVE
          SII_WORKER_URL: ${{ secrets.SII_WORKER_URL }}
          SII_WORKER_KEY: ${{ secrets.SII_WORKER_KEY }}   # clave del worker tributario (ver sii-worker)
          SII_ACCESS_MODE: ${{ vars.SII_ACCESS_MODE }}  # opt-in: activar SOLO tras migrar Access y secretos en Cloudflare
          SII_CUTOVER_VERIFIED: ${{ vars.SII_CUTOVER_VERIFIED }}  # segundo control: sesiones, CORS, roles y certificación comprobados
          SII_RUT_EMISOR: ${{ secrets.SII_RUT_EMISOR }}
          SII_RAZON_SOCIAL: ${{ secrets.SII_RAZON_SOCIAL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          PRINTER_TUNNEL: ${{ secrets.PRINTER_TUNNEL }}
          ADS_WEBAPP: ${{ secrets.ADS_WEBAPP }}
          ADS_CUSTOMER: ${{ secrets.ADS_CUSTOMER }}
          PRINTER_TUNNEL_TOKEN: ${{ secrets.PRINTER_TUNNEL_TOKEN }}
          PRINTER_ACCESS_MODE: ${{ vars.PRINTER_ACCESS_MODE }}
          PRINTER_CUTOVER_VERIFIED: ${{ vars.PRINTER_CUTOVER_VERIFIED }}
          LEAD_WORKER_URL: ${{ secrets.LEAD_WORKER_URL }}
          PUBLIC_LEAD_KEY: ${{ secrets.PUBLIC_LEAD_KEY }}
          PORTAL_ADMIN_KEY: ${{ secrets.PORTAL_ADMIN_KEY }}
          PORTAL_ACCESS_MODE: ${{ vars.PORTAL_ACCESS_MODE }}
          PORTAL_CUTOVER_VERIFIED: ${{ vars.PORTAL_CUTOVER_VERIFIED }}
          FEEDBACK_ACCESS_MODE: ${{ vars.FEEDBACK_ACCESS_MODE }}
          FEEDBACK_CUTOVER_VERIFIED: ${{ vars.FEEDBACK_CUTOVER_VERIFIED }}
        run: |
          # Nunca publicar un PAT de Airtable en GitHub Pages, ni siquiera
          # cuando falte el Proxy. Si no hay backend configurado se detiene
          # el deploy y la versión actualmente publicada queda intacta.
          if [ -z "${PROXY_URL}" ] || [ -z "${PROXY_KEY}" ]; then
            echo "::error::PROXY_URL y PROXY_KEY son obligatorios. Deploy bloqueado para evitar exponer Airtable."
            exit 1
          fi
          echo "Modo proxy obligatorio: Airtable y la IA usan airtable-proxy."
          sed -i "s|%%GOOGLE_CLIENT_ID%%|${GOOGLE_CLIENT_ID}|g" index.html
          # Portal del cliente: lo sirve el lead-worker. El dashboard solo necesita
          # su URL y PORTAL_ADMIN_KEY para pedir el link firmado de cada cliente.
          if [ -n "${LEAD_WORKER_URL}" ]; then sed -i "s|%%LEAD_WORKER_URL%%|${LEAD_WORKER_URL}|g" index.html; fi
          if [ -n "${PUBLIC_LEAD_KEY}" ]; then sed -i "s|%%PUBLIC_LEAD_KEY%%|${PUBLIC_LEAD_KEY}|g" index.html; fi
          if [ "${PORTAL_ACCESS_MODE}" = "true" ]; then
            # A deliberate human verification gate prevents an accidental
            # switch while Cloudflare Access or the proxy is still unconfigured.
            if [ "${PORTAL_CUTOVER_VERIFIED}" != "true" ]; then
              echo "::error::Portal Access requires verified backend and signed user roles before cutover."
              exit 1
            fi
            sed -i "s|%%PORTAL_ADMIN_KEY%%||g" index.html
            sed -i "s|%%PORTAL_ACCESS_MODE%%|true|g" index.html
            echo "Portal Access enabled: administrative portal key is absent from Pages."
          else
            if [ -n "${PORTAL_ADMIN_KEY}" ]; then sed -i "s|%%PORTAL_ADMIN_KEY%%|${PORTAL_ADMIN_KEY}|g" index.html; fi
            sed -i "s|%%PORTAL_ACCESS_MODE%%|false|g" index.html
          fi
          # Feedback/NPS/POD/tracking: no unsigned base64 links after the
          # signed issuer cutover; leave legacy unchanged until both Workers,
          # browser Access sessions and same-site proxy DNS are verified.
          if [ "${FEEDBACK_ACCESS_MODE}" = "true" ]; then
            if [ "${FEEDBACK_CUTOVER_VERIFIED}" != "true" ] || [ "${PORTAL_ACCESS_MODE}" != "true" ] ||
               [ -z "${LEAD_WORKER_URL}" ] ||
               [[ ! "${PROXY_URL}" =~ ^https://[a-z0-9-]+\.thelab\.solutions/?$ ]]; then
              echo "::error::Feedback Access requires verified portal Access, a same-site proxy and a configured lead Worker."
              exit 1
            fi
            sed -i "s|%%FEEDBACK_ACCESS_MODE%%|true|g" js/agentes.js
            echo "Signed customer feedback links enabled; legacy fallback disabled in dashboard."
          else
            sed -i "s|%%FEEDBACK_ACCESS_MODE%%|false|g" js/agentes.js
          fi
          sed -i "s|%%SII_WORKER_URL%%|${SII_WORKER_URL}|g" index.html
          if [ "${SII_ACCESS_MODE}" = "true" ]; then
            # Prevenir activaciones accidentales que bloqueen Facturas a todo
            # el equipo. Este segundo control se habilita SOLO tras probar
            # Cloudflare Access, CORS/OPTIONS, roles y SII de certificación.
            if [ "${SII_CUTOVER_VERIFIED}" != "true" ]; then
              echo "::error::SII Access requires SII_CUTOVER_VERIFIED=true after real Cloudflare Access and certification checks."
              exit 1
            fi
            # cookies CF_Authorization deben viajar entre subdominios del
            # mismo sitio. workers.dev rompe la sesión para muchos navegadores.
            if [[ ! "${PROXY_URL}" =~ ^https://[a-z0-9-]+\.thelab\.solutions/?$ ]]; then
              echo "::error::SII Access requires an HTTPS same-site proxy host at *.thelab.solutions (no workers.dev, paths or queries)."
              exit 1
            fi
            # Nunca publicar la clave fiscal cuando el dashboard usa el puente
            # autenticado. El secreto vive únicamente en los Workers.
            sed -i "s|%%SII_WORKER_KEY%%||g" index.html
            sed -i "s|%%SII_ACCESS_MODE%%|true|g" js/finanzas.js
            echo "SII Access habilitado: no se inyecta clave fiscal al navegador."
          else
            if [ -n "${SII_WORKER_KEY}" ]; then sed -i "s|%%SII_WORKER_KEY%%|${SII_WORKER_KEY}|g" index.html; fi
            sed -i "s|%%SII_ACCESS_MODE%%|false|g" js/finanzas.js
          fi
          sed -i "s|%%SII_RUT_EMISOR%%|${SII_RUT_EMISOR}|g" index.html
          sed -i "s|%%SII_RAZON_SOCIAL%%|${SII_RAZON_SOCIAL}|g" index.html
          sed -i "s|%%PROXY_URL%%|${PROXY_URL}|g" index.html
          sed -i "s|%%PROXY_KEY%%|${PROXY_KEY}|g" index.html
          sed -i "s|%%PRINTER_TUNNEL%%|${PRINTER_TUNNEL}|g" index.html
          sed -i "s|%%ADS_WEBAPP%%|${ADS_WEBAPP}|g" index.html
          sed -i "s|%%ADS_CUSTOMER%%|${ADS_CUSTOMER}|g" index.html
          if [ "${PRINTER_ACCESS_MODE}" = "true" ]; then
            if [ "${PRINTER_CUTOVER_VERIFIED}" != "true" ]; then
              echo "::error::Printer Access requires verified role-scoped Farm Controller tokens before cutover."
              exit 1
            fi
            # The master printer key must never be baked into the published page.
            sed -i "s|%%PRINTER_TUNNEL_TOKEN%%||g" index.html
            sed -i "s|%%PRINTER_ACCESS_MODE%%|true|g" js/maquinas.js
            echo "Printer Access mode enabled: no master key published."
          else
            sed -i "s|%%PRINTER_TUNNEL_TOKEN%%|${PRINTER_TUNNEL_TOKEN}|g" index.html
            sed -i "s|%%PRINTER_ACCESS_MODE%%|false|g" js/maquinas.js
          fi

      - name: Inject secrets into cotiza.html (cotizador público)
        env:
          LEAD_WORKER_URL: ${{ secrets.LEAD_WORKER_URL }}
          PUBLIC_LEAD_KEY: ${{ secrets.PUBLIC_LEAD_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          # Sin secrets configurados, los %%…%% quedan y el formulario cae a mailto: — no se rompe.
          if [ -n "${LEAD_WORKER_URL}" ]; then sed -i "s|%%LEAD_WORKER_URL%%|${LEAD_WORKER_URL}|g" cotiza.html; fi
          if [ -n "${PUBLIC_LEAD_KEY}" ]; then sed -i "s|%%PUBLIC_LEAD_KEY%%|${PUBLIC_LEAD_KEY}|g" cotiza.html; fi
          if [ -n "${TURNSTILE_SITE_KEY}" ]; then sed -i "s|%%TURNSTILE_SITE_KEY%%|${TURNSTILE_SITE_KEY}|g" cotiza.html; fi

      - name: Stamp build version (cache-busting de styles.css, js/* y service worker)
        run: sed -i "s|%%BUILD%%|${GITHUB_SHA::8}|g" index.html sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Recuperación puntual: un deploy de Pages cancelado puede quedar
      # retenido server-side y bloquear todos los siguientes con HTTP 400.
      # Cancelamos el Pages deployment y eliminamos SOLO los deployments
      # estándar asociados al SHA atascado en el entorno github-pages.
      - name: Clear stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_SHA: 19cf5c537e6b2503241088aaae03cbd1636dd686
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' -H "Authorization: Bearer ${GH_TOKEN}")

          status=$(curl -sS -o /tmp/pages-cancel-response -w '%{http_code}' -X POST "${headers[@]}" \
            "${api}/pages/deployments/${STALE_SHA}/cancel")
          if [ "$status" = 204 ]; then
            echo 'Pages deployment atascado cancelado'
          elif [ "$status" = 404 ]; then
            echo 'Pages deployment atascado ya no existe'
          else
            cat /tmp/pages-cancel-response
            exit 1
          fi

          curl -sS "${headers[@]}" \
            "${api}/deployments?sha=${STALE_SHA}&environment=github-pages&per_page=100" \
            -o /tmp/stale-deployments.json

          python3 -c 'import json; data=json.load(open("/tmp/stale-deployments.json")); print("\n".join(str(dep["id"]) for dep in data if dep.get("sha")=="19cf5c537e6b2503241088aaae03cbd1636dd686" and dep.get("environment")=="github-pages"))' > /tmp/stale-deployment-ids

          while read -r deployment_id; do
            [ -n "$deployment_id" ] || continue
            code=$(curl -sS -o /tmp/deployment-status-response -w '%{http_code}' -X POST "${headers[@]}" \
              "${api}/deployments/${deployment_id}/statuses" \
              -d '{"state":"inactive","description":"Cleared stale GitHub Pages deployment"}')
            if [ "$code" != 201 ] && [ "$code" != 422 ]; then
              cat /tmp/deployment-status-response
              exit 1
            fi

            code=$(curl -sS -o /tmp/deployment-delete-response -w '%{http_code}' -X DELETE "${headers[@]}" \
              "${api}/deployments/${deployment_id}")
            if [ "$code" = 204 ] || [ "$code" = 404 ]; then
              echo "Deployment estándar ${deployment_id} liberado"
            else
              cat /tmp/deployment-delete-response
              exit 1
            fi
          done </tmp/stale-deployment-ids

          # Pages tarda unos segundos en soltar el lock aun después del cleanup.
          sleep 10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
