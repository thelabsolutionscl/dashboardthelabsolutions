name: Final cutover preflight
# Updating this file intentionally triggers one read-only production preflight.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-cutover-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repository prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "SHA=${GITHUB_SHA}"
          node --test tests/access-readiness.test.js tests/access-rollout-config.test.js
      - name: Read-only production readiness
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          PREFLIGHT_CF_CLIENT_ID: ${{ secrets.PREFLIGHT_CF_CLIENT_ID }}
          PREFLIGHT_CF_CLIENT_SECRET: ${{ secrets.PREFLIGHT_CF_CLIENT_SECRET }}
          SII_WORKER_KEY: ${{ secrets.SII_WORKER_KEY }}
          PORTAL_ADMIN_KEY: ${{ secrets.PORTAL_ADMIN_KEY }}
          PRINTER_TUNNEL_TOKEN: ${{ secrets.PRINTER_TUNNEL_TOKEN }}
          SII_ACCESS_MODE: ${{ vars.SII_ACCESS_MODE }}
          STAGE: before
        run: node scripts/access-readiness.mjs
