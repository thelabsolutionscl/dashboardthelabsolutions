name: Capturas Manual Usuario

on:
  push:
    branches:
      - manual-screenshots-v1
    paths:
      - scripts/capture-manual-screenshots.mjs
      - .github/workflows/manual-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: manual-screenshots-v1
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Levantar dashboard local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/manual-http.log 2>&1 &
          echo $! > /tmp/manual-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/manual-http.log
          exit 1

      - name: Capturar pantallas seguras en DEMO
        run: node scripts/capture-manual-screenshots.mjs

      - name: Validar capturas
        run: |
          count=$(find docs/manual/assets -maxdepth 1 -name '*.png' | wc -l)
          echo "Capturas generadas: $count"
          test "$count" -ge 22
          test -s docs/manual/assets/overview.png
          test -s docs/manual/assets/maquinas.png
          test -s docs/manual/assets/finanzas.png
          test -s docs/manual/assets/centro-conexiones.png
          test -s docs/manual/assets/apariencia.png

      - name: Guardar capturas en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual/assets
          if git diff --cached --quiet; then
            echo "Sin cambios en capturas"
            exit 0
          fi
          git commit -m "docs(manual): actualizar screenshots [skip ci]"
          git push origin HEAD:manual-screenshots-v1
