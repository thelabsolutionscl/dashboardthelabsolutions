name: Capturas Manual Usuario

on:
  pull_request:
    branches: [main]
    paths:
      - manual.html
      - docs/manual/MANUAL_USUARIO.md
      - scripts/capture-manual-screenshots.mjs
      - .github/workflows/manual-screenshots.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Levantar dashboard local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/manual-http.log 2>&1 &
          echo $! > /tmp/manual-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/manual-http.log
          exit 1

      - name: Capturar pantallas seguras en DEMO
        run: node scripts/capture-manual-screenshots.mjs

      - name: Validar capturas
        run: |
          count=$(find docs/manual/assets -maxdepth 1 -name '*.png' | wc -l)
          echo "Capturas generadas: $count"
          test "$count" -ge 42
          test -s docs/manual/assets/overview.png
          test -s docs/manual/assets/maquinas.png
          test -s docs/manual/assets/finanzas.png
          test -s docs/manual/assets/centro-conexiones.png
          test -s docs/manual/assets/apariencia.png
          test -s docs/manual/assets/nueva-cotizacion.png
          test -s docs/manual/assets/pedidos-tabla.png
          test -s docs/manual/assets/maquinas-planificacion.png
          test -s docs/manual/assets/finanzas-por-cobrar.png
          test -s docs/manual/assets/correo-redactar.png\n          test -s docs/manual/assets/reportar-problema.png
          test -s docs/manual/assets/manual-web.png

      - name: Guardar capturas actualizadas en el PR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual/assets
          if git diff --cached --quiet; then
            echo "Sin cambios en capturas"
            exit 0
          fi
          git commit -m "docs(manual): actualizar screenshots"
          git push origin HEAD:"${TARGET_BRANCH}"
