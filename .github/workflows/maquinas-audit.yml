name: Auditoría Máquinas

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'js/maquinas*.js'
      - 'js/machineops-*.js'
      - 'js/printer-history-adapter.js'
      - 'js/farm-*.js'
      - 'js/dashboard-notification-badges.js'
      - 'js/correo-input-compat.js'
      - 'js/slicer3d.js'
      - 'printer-bridge/**'
      - 'printer-access-worker/**'
      - 'tests/maquinas-*.test.js'
      - 'tests/machine-ops-*.test.js'
      - 'tests/machineops-*.test.js'
      - 'tests/farm-*.test.js'
      - 'tests/printer-*.test.js'
      - 'tests/dashboard-notification-badges.test.js'
      - 'tests/correo-input-compat.test.js'
      - 'tests/service-worker-*.test.js'
      - '.github/workflows/maquinas-audit.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'js/maquinas*.js'
      - 'js/machineops-*.js'
      - 'js/printer-history-adapter.js'
      - 'js/farm-*.js'
      - 'js/dashboard-notification-badges.js'
      - 'js/correo-input-compat.js'
      - 'js/slicer3d.js'
      - 'printer-bridge/**'
      - 'printer-access-worker/**'
      - 'tests/maquinas-*.test.js'
      - 'tests/machine-ops-*.test.js'
      - 'tests/machineops-*.test.js'
      - 'tests/farm-*.test.js'
      - 'tests/printer-*.test.js'
      - 'tests/dashboard-notification-badges.test.js'
      - 'tests/correo-input-compat.test.js'
      - 'tests/service-worker-*.test.js'
      - '.github/workflows/maquinas-audit.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maquinas-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maquinas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: |
          node --check js/maquinas.js
          node --check js/maquinas-led.js
          node --check js/maquinas-operaciones.js
          node --check js/maquinas-farm-controller.js
          node --check js/maquinas-eta-clarity.js
          node --check js/machineops-storage-adapter.js
          node --check js/machineops-unattended-safety.js
          node --check js/machineops-farm-queue-adapter.js
          node --check js/printer-history-adapter.js
          node --check js/farm-health-adapter.js
          node --check js/farm-drift-adapter.js
          node --check js/farm-reliability-adapter.js
          node --check js/farm-identity-adapter.js
          node --check js/farm-session-login-ui.js
          node --check js/dashboard-notification-badges.js
          node --check js/correo-input-compat.js
          node --check js/slicer3d.js
          node --check sw.js
          node --check printer-bridge/server.js
          node --check printer-bridge/farm-controller.js
          node --check printer-bridge/farm-bind-preload.js
          node --check printer-bridge/farm-auth-preload.js
          node --check printer-bridge/farm-queue-guard-preload.js
          node --check printer-bridge/farm-storage-interlock-preload.js
          node --check printer-bridge/farm-queue-import-preload.js
          node --check printer-bridge/farm-queue-terminal-preload.js
          node --check printer-bridge/farm-production-preload.js
          node --check printer-bridge/farm-drift-preload.js
          node --check printer-bridge/farm-health-preload.js
          node --check printer-bridge/farm-reliability-preload.js
          node --check printer-bridge/farm-safety-agent-preload.js
          node --check printer-bridge/farm-safety-authority-preload.js
          node --check printer-bridge/farm-lifecycle-preload.js
          node --check printer-bridge/farm-identity-preload.js
          node --check printer-access-worker/src/index.js
          node --check printer-access-worker/src/session.mjs
          bash -n printer-bridge/install-farm-controller.sh
          bash -n printer-bridge/rollback-farm-controller.sh
      - name: Probar cache y actualización del dashboard
        run: node --test tests/service-worker-cache-safety.test.js tests/service-worker-registration.test.js
      - name: Probar autenticación Access y aislamiento de red
        run: node --test tests/farm-auth-preload.test.js tests/farm-bind-preload.test.js tests/printer-access-worker-session.test.mjs
      - name: Probar cola única cuotas importación LAN y terminales
        run: node --test tests/machineops-farm-queue-adapter.test.js tests/farm-hardening-core.test.js tests/farm-storage-interlock.test.js tests/farm-queue-import-preload.test.js tests/farm-queue-terminal-preload.test.js
      - name: Probar controlador y producción durable
        run: node --test tests/farm-controller.test.js tests/farm-production-preload.test.js
      - name: Probar seguridad desatendida autoritativa
        run: node --test tests/machineops-unattended-safety.test.js tests/farm-safety-authority.test.js
      - name: Probar observabilidad y continuidad
        run: node --test tests/farm-health-preload.test.js tests/farm-health-adapter.test.js tests/farm-health-wiring.test.js tests/farm-health-continuity.test.js
      - name: Probar confiabilidad histórica
        run: node --test tests/farm-reliability-preload.test.js tests/farm-reliability-adapter.test.js tests/farm-reliability-wiring.test.js
      - name: Probar config drift e identidad firmware
        run: node --test tests/farm-drift-preload.test.js tests/farm-drift-adapter.test.js tests/farm-drift-wiring.test.js tests/farm-identity-preload.test.js
      - name: Probar badges y teclado de correo
        run: node --test tests/dashboard-notification-badges.test.js tests/correo-input-compat.test.js
      - name: Probar persistencia normalizada de MachineOps
        run: node --test tests/machineops-storage-adapter.test.js
      - name: Probar historial y odómetro durable
        run: node --test tests/printer-history-adapter.test.js tests/printer-history-wiring.test.js
      - name: Verificar que Pages no publique el token de granja
        run: |
          if grep -q 'secrets.PRINTER_TUNNEL_TOKEN' .github/workflows/deploy.yml; then
            echo 'deploy.yml vuelve a publicar PRINTER_TUNNEL_TOKEN' >&2
            exit 1
          fi
      - name: Auditar cableado integral
        run: node --test tests/maquinas-wiring.test.js tests/farm-hardening-wiring.test.js
      - name: Probar operaciones, telemetría y regresiones de Máquinas
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/maquinas-*.test.js tests/machine-ops-*.test.js tests/recuperar-telemetria.test.js tests/capacidad-futura.test.js tests/ocupacion-agrupada.test.js)
          printf 'Ejecutando %s tests\n' "${#files[@]}"
          node --test "${files[@]}"
