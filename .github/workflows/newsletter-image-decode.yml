name: Newsletter image decode

on:
  push:
    branches:
      - fix/newsletter-image-quality-final
    paths:
      - 'tmp/newsletter-image/**'
      - '.github/workflows/newsletter-image-decode.yml'

permissions:
  contents: write

jobs:
  decode:
    if: ${{ !contains(github.event.head_commit.message, '[decoded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify newsletter image
        run: |
          mkdir -p assets/newsletter
          cat tmp/newsletter-image/milankoi.part1.b64 tmp/newsletter-image/milankoi.part2.b64 | base64 --decode > assets/newsletter/figura-milankoi-email.jpg
          test "$(stat -c%s assets/newsletter/figura-milankoi-email.jpg)" = "14112"
          file assets/newsletter/figura-milankoi-email.jpg | grep -qi "JPEG image data"
      - name: Commit decoded asset and cleanup staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/newsletter/figura-milankoi-email.jpg
          git rm -r tmp/newsletter-image
          git rm .github/workflows/newsletter-image-decode.yml
          git commit -m "[decoded] fix(newsletter): add crisp product photo"
          git push origin HEAD:fix/newsletter-image-quality-final
