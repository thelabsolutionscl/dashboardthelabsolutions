name: Proveedores audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/proveedores.js'
      - 'lead-worker/src/index.js'
      - 'tests/proveedores-wiring.test.js'
      - 'tests/smoke.test.js'
      - 'docs/audits/PROVEEDORES.md'
      - '.github/workflows/proveedores-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/proveedores.js'
      - 'lead-worker/src/index.js'
      - 'tests/proveedores-wiring.test.js'
      - 'tests/smoke.test.js'
      - 'docs/audits/PROVEEDORES.md'
      - '.github/workflows/proveedores-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplier-master-prices-and-purchase-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate audit syntax
        run: node --check tests/proveedores-wiring.test.js

      - name: Validate supplier modules
        run: |
          node --check js/proveedores.js
          node --check lead-worker/src/index.js

      - name: Audit supplier wiring and controls
        run: node --test tests/proveedores-wiring.test.js

      - name: General smoke audit
        run: node tests/smoke.test.js
