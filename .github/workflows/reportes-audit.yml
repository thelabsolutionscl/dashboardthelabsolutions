name: Reportes audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**.js'
      - 'tests/reportes-wiring.test.js'
      - 'tests/smoke.test.js'
      - '.github/workflows/reportes-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**.js'
      - 'tests/reportes-wiring.test.js'
      - 'tests/smoke.test.js'
      - '.github/workflows/reportes-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executive-report-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check tests/reportes-wiring.test.js
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Audit executive reports
        run: node --test tests/reportes-wiring.test.js

      - name: General smoke audit
        run: node tests/smoke.test.js
