name: Reportes live production smoke (read-only)

on:
  workflow_run:
    workflows: ["Deploy Dashboard"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout committed smoke script
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test read-only probes
        run: node --test tests/reportes-live-smoke.test.js
      - name: Verify actual public Pages and proxy
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node scripts/reportes-live-smoke.mjs

# No credentials, model calls, mutations, writes, or privileged endpoints.
# PASS means public availability and expected build, not signed user-session RBAC.
