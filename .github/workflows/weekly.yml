name: Automatización semanal

# Corre solo en el servidor (GitHub Actions) — no necesita que nadie abra el dashboard.
# 1) Respalda TODAS las tablas de Airtable a un JSON y lo guarda como artifact (90 días).
# 2) (Opcional) Envía un resumen directamente por Resend.
#
# Secrets que usa:
#   AIRTABLE        (ya existe — el mismo del deploy)
#   RESEND_API_KEY  (opcional; sin él no se envía el resumen)
#   RESEND_FROM     (opcional; fallback: The Lab Solutions <hola@thelab.solutions>)
#   REPORT_EMAIL    (opcional; sin él no se envía el resumen)

on:
  schedule:
    # Lunes 12:00 UTC = 08:00 en Chile en invierno (UTC-4); 09:00 en horario de verano (UTC-3).
    - cron: '0 12 * * 1'
  workflow_dispatch: {} # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backup Airtable → JSON
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE }}
        run: node scripts/backup-airtable.mjs

      - name: Guardar backup como artifact (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: backup-crm-${{ github.run_id }}
          path: backup/
          retention-days: 90

      - name: Enviar resumen por Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: node scripts/send-weekly-report.mjs
