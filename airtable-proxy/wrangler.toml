name = "airtable-proxy"
main = "src/worker.js"
compatibility_date = "2025-04-01"
workers_dev = false

# Este Worker debe publicarse detrás de un dominio protegido por Cloudflare
# Access. workers_dev está desactivado para impedir que la URL alternativa
# omita la política de Access.
#
# Secrets server-side:
#   wrangler secret put AIRTABLE_TOKEN
#   wrangler secret put ANTHROPIC_TOKEN
#   wrangler secret put OPENAI_TOKEN
#   wrangler secret put CF_ACCESS_AUD
#
# Variables que se deben completar antes del deploy:
#   CF_ACCESS_TEAM_DOMAIN = "https://TU-EQUIPO.cloudflareaccess.com"
#   WRITE_EMAILS          = "usuario1@dominio.cl,usuario2@dominio.cl"
#   ADMIN_EMAILS          = "administrador@dominio.cl"
#
# Autenticación legacy:
#   No se usa APP_KEY en producción y el frontend ya no la publica.
#   ALLOW_LEGACY_APP_KEY solo puede habilitarse temporalmente durante una
#   migración controlada; exige además un Origin permitido.

[vars]
AIRTABLE_BASE_ID = "app1YtD74AqiPWQhy"
AIRTABLE_ALLOWED_TABLES = "Clientes,Cotizaciones,Pedidos,Proveedores,Facturas,Reportes,Maquinas,Automations,Social_Posts,Social_Interactions,Agent_Log,Agent_Queue,Inventario,Eventos,Calendario,Newsletter,Reclamos,Retainers,Ordenes_Compra,Catalogo,Presupuesto,Pagos_Programados,Gastos,Audit_Log"
AUDIT_TABLE = "Audit_Log"
HEARTBEAT_TABLE = "Automations"
HEARTBEAT_ID = "airtable-proxy"
ALLOW_LEGACY_APP_KEY = "false"
ALLOW_AIRTABLE_DELETE = "false"
ALLOW_READER_AI = "false"
RATE_LIMIT_PER_MINUTE = "180"
AI_RATE_LIMIT_PER_MINUTE = "20"
AI_MAX_TOKENS = "8192"
MAX_AIRTABLE_BODY_BYTES = "2097152"
MAX_STATE_BODY_BYTES = "2097152"
MAX_AI_BODY_BYTES = "12582912"

# Persistencia central para Calendario Operacional, cola de impresión y
# odómetro. Crear el namespace una sola vez:
#   npx wrangler kv namespace create DASHBOARD_STATE
# Copiar el id devuelto y descomentar/rellenar el bloque:
#
# [[kv_namespaces]]
# binding = "DASHBOARD_STATE"
# id = "PEGAR_ID_KV_AQUI"

# Deploy:
#   cd airtable-proxy
#   npx wrangler deploy
#
# Después proteger el hostname completo con Cloudflare Zero Trust → Access →
# Applications y usar el mismo Application Audience (AUD) en CF_ACCESS_AUD.
