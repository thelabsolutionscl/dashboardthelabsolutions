name = "airtable-proxy"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Secrets — ejecutar una vez después del deploy:
#   wrangler secret put AIRTABLE_TOKEN    ← tu PAT de Airtable (patXXX...)
#   wrangler secret put ANTHROPIC_TOKEN   ← tu API key de Anthropic (sk-ant-...)
#   wrangler secret put OPENAI_TOKEN      ← tu API key de OpenAI (sk-...) para las vistas de la ficha
#   wrangler secret put APP_KEY           ← passphrase que elijas (mínimo 20 chars)
#
# Deploy:
#   cd airtable-proxy && npx wrangler deploy
#
# Luego en el dashboard (Mi cuenta → Proxy Worker):
#   URL:   https://airtable-proxy.<tu-subdominio>.workers.dev
#   Clave: el mismo valor que pusiste en APP_KEY
#
# Con esto, ni el PAT de Airtable ni la API key de Anthropic salen al navegador:
#   - Airtable:  <worker>/<base>/<tabla>           (el dashboard ya lo usa)
#   - Claude:    <worker>/anthropic/v1/messages    (callClaude lo usa automáticamente)
#   - OpenAI:    <worker>/openai/v1/...            (vistas IA de la ficha propuesta)
#
# Oficina Virtual — latido automático:
#   Tras el deploy, el proxy marca su fila ID="airtable-proxy" en la tabla
#   Automations como "Activo" con la hora actual (máx. 1 vez cada 5 min,
#   fire-and-forget, sin añadir latencia). Usa la base del dashboard por
#   defecto; para apuntar a otra base define la variable:
#     [vars]  HEARTBEAT_BASE = "appXXXXXXXXXXXXXX"


[vars]
# Tope diario del proxy Anthropic. Ajustable sin modificar el dashboard.
ANTHROPIC_DAILY_BUDGET_USD = "1.00"
# Tope conservador por solicitud para impedir una generación accidental enorme.
ANTHROPIC_REQUEST_BUDGET_USD = "0.20"

# Reutiliza el KV ya disponible en esta cuenta Cloudflare para el control de costo.
[[kv_namespaces]]
binding = "AI_BUDGET"
id = "c148848321344f60939fa71a51d050c6"


# Guard atómico: todas las reservas Anthropic del dashboard pasan por una sola
# instancia coordinada. KV queda enlazado únicamente para migrar el saldo legado
# del día al primer acceso.
[[durable_objects.bindings]]
name = "AI_BUDGET_GUARD"
class_name = "AiBudgetGuard"

[[migrations]]
tag = "v1-anthropic-budget-atomic"
new_sqlite_classes = ["AiBudgetGuard"]
