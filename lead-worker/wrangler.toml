# thelab-leads-worker — endpoint público de captación de leads
# Despliegue:  cd lead-worker && npx wrangler deploy
# Dev local:   npx wrangler dev   (usa .dev.vars para secretos locales)

name = "thelab-leads-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Observabilidad (logs/analytics del Worker)
[observability]
enabled = true

# Reintento de leads en buffer (dead-letter) cada hora
# + Piloto automático de Google Ads: lunes 12:00 UTC (08/09h en Chile)
[triggers]
crons = ["17 * * * *", "0 12 * * 1"]

# ── Variables NO secretas ──────────────────────────────────────────────
# El Base ID de Airtable NO es secreto (aparece en URLs), por eso va aquí.
[vars]
AIRTABLE_BASE_ID = "app1YtD74AqiPWQhy"
# Orígenes permitidos para CORS (coma-separado). Sin wildcard.
ALLOWED_ORIGINS = "https://thelab.solutions,https://www.thelab.solutions,https://dashboard.thelab.solutions,https://thelabsolutionscl.github.io,http://localhost:3000"
# "true" para que el Worker llame a Claude y deje el lead pre-scoreado.
AUTO_PROCESS_LEADS = "false"
# Si se reactiva: máximo de leads pre-scoreados automáticamente por día.
AUTO_PROCESS_DAILY_CAP = "25"
# Presupuesto conservador para TODAS las llamadas Anthropic directas de este Worker.
AI_DAILY_BUDGET_USD = "0.50"
# Poda diaria de Agent_Queue: borra tareas "Completado" con más de N días
# (Pendiente/Procesando/Error se conservan siempre). "0" la desactiva.
CLEANUP_QUEUE_DAYS = "30"
# Auto-respuesta al lead (requiere secret RESEND_API_KEY). From debe ser dominio verificado en Resend.
RESEND_FROM = "The Lab Solutions <hola@thelab.solutions>"
# Remitente VISIBLE de la auto-respuesta al cliente (nombre de quien atiende). Dominio verificado en Resend.
RESEND_FROM_CLIENTE = "Andrea Garrido - The Lab Solutions <hola@thelab.solutions>"
WHATSAPP_NUMBER = "56928785039"
# Newsletter: doble opt-in. Con RESEND_API_KEY configurado, /newsletter envía un correo
# de confirmación y NO suscribe hasta que el usuario hace clic. Poner "false" para alta directa.
NEWSLETTER_DOUBLE_OPTIN = "true"

# ── Piloto automático de Google Ads (semanal, con aprobación por email) ──
# "true" activa la corrida del lunes. Nada se aplica sin aprobar el email.
ADS_AUTOPILOT = "false"
# URL del endpoint del Script 1 (Apps Script) — la misma del dashboard.
ADS_ENDPOINT = ""
# URL pública de ESTE worker (para los links Aprobar/Rechazar del email).
WORKER_PUBLIC_URL = ""
# Destinatario del email semanal (fallback: LEADS_NOTIFY_TO).
ADS_AUTOPILOT_EMAIL = "thelabsolutionscl@gmail.com"

# ── Avisos internos por WhatsApp (API oficial de Meta) — ver src/wa-notify.js ──
# Leads → Nicanor+Gustavo · cotizaciones por enviar → Nicanor ·
# pedidos por vencer + impresoras → Gustavo. Sin WA_PHONE_NUMBER_ID y el
# secreto WA_ACCESS_TOKEN no envía nada.
WA_NOTIFY_ENABLED = "true"
# Meta → WhatsApp → Configuración de la API → "Identificador del número de teléfono" (KAI TLS).
WA_PHONE_NUMBER_ID = ""
WA_PHONE_NICANOR = "56971806142"
WA_PHONE_GUSTAVO = "56988285822"
# Hora de Chile del resumen diario de recordatorios (el cron corre a los :17).
WA_DIGEST_HOUR = "9"
# Plantilla utility aprobada en Meta con {{1}} = título y {{2}} = detalle. Se usa
# cuando la persona no escribió al número en las últimas 24 h. Vacío = solo texto.
WA_TEMPLATE_NAME = ""
WA_TEMPLATE_LANG = "es"

# ── KV opcional para rate-limiting ─────────────────────────────────────
# Crear con:  npx wrangler kv namespace create LEADS_RL
# y luego descomentar y pegar el id:
[[kv_namespaces]]
binding = "RL"
id = "c148848321344f60939fa71a51d050c6"

# ── SECRETOS (NO escribir valores aquí) ────────────────────────────────
# Configurar con:  npx wrangler secret put NOMBRE
#   AIRTABLE_TOKEN          (PAT de Airtable con scope data.records:write)
#   PUBLIC_LEAD_KEY         (clave compartida con la web — anti-bot básico)
#   GOOGLE_ADS_WEBHOOK_KEY  (clave del webhook de Google Lead Form)
#   LINKEDIN_WEBHOOK_KEY    (clave del webhook de LinkedIn vía Make/Zapier)
#   TURNSTILE_SECRET        (opcional — verificación Cloudflare Turnstile)
#   ANTHROPIC_API_KEY       (opcional — solo si AUTO_PROCESS_LEADS=true)
#   RESEND_API_KEY          (opcional — auto-respuesta de leads + confirmación de newsletter)
#   NEWSLETTER_SECRET       (opcional — firma tokens de confirmación/baja; si falta usa PUBLIC_LEAD_KEY)
#   PORTAL_SECRET           (portal del cliente — firma los links de /portal. Ponlo:
#                            sin él cae a NEWSLETTER_SECRET/AIRTABLE_TOKEN y rotar
#                            ese token invalida todos los links ya enviados)
#   PORTAL_ADMIN_KEY        (portal del cliente — OBLIGATORIO para emitir links desde
#                            el dashboard vía POST /portal/link. Sin fallback: el mismo
#                            valor va en el secret PORTAL_ADMIN_KEY de GitHub Actions)
#   ADS_APPROVAL_SECRET     (piloto Ads — OBLIGATORIO para los links Aprobar/Rechazar del email
#                            y el disparo manual; sin él solo se aprueba desde el dashboard)
#   ADS_SCRIPT_SECRET       (piloto Ads — secret del Script 1; si falta usa el default del Script)
#   WA_ACCESS_TOKEN         (WhatsApp Meta — token PERMANENTE de un usuario del sistema)
#   WA_APP_SECRET           (WhatsApp Meta — "Clave secreta de la app"; valida la firma del webhook)
#   WA_VERIFY_TOKEN         (WhatsApp Meta — texto al azar que se repite al configurar el webhook)
#   WA_NOTIFY_KEY           (avisos WhatsApp — clave de /notify/printer y /notify/test;
#                            el mismo valor va en PRINT_NOTIFY_KEY del farm-controller)
