name = "sii-dte-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cambiar a "certificacion" para pruebas con maullin.sii.cl
[vars]
SII_ENV = "certificacion"

# KV namespace para folios y CAFs (crear con: wrangler kv namespace create FOLIOS_KV)
[[kv_namespaces]]
binding = "FOLIOS_KV"
id = "12c2c38ebe2d47b39e20daafddfa6ea7"

# Secrets — configurar con: bash setup-secrets.sh  (o: wrangler secret put NOMBRE)
# Nombres requeridos (los VALORES reales NO van aquí — viven como secrets):
#   WORKER_KEY, CERT_PFX_BASE64, CERT_PFX_PASSWORD, RUT_EMISOR, RAZON_SOCIAL,
#   GIRO_EMISOR, ACTECO, DIR_EMISOR, CMNA_EMISOR, CIUDAD_EMISOR,
#   RESOLUCION_FECHA, RESOLUCION_NUMERO
#
# Oficina Virtual (opcional) — para que este Worker reporte su latido a la
# tabla Automations del dashboard, configura además:
#   wrangler secret put AIRTABLE_TOKEN     (PAT con scope data.records:write)
#   wrangler secret put AIRTABLE_BASE_ID   (= app1YtD74AqiPWQhy)
# Sin estos, el latido simplemente no se ejecuta (no afecta la emisión de DTE).

# Folios: un Durable Object por tipo de DTE serializa reservas y cambios de CAF.
# Es obligatorio para /emit, /folio y /caf. Sin enlace, emisión fail-closed.
[[durable_objects.bindings]]
name = "FOLIO_GUARD"
class_name = "SiiFolioGuard"

[[migrations]]
tag = "v1-sii-folios-atomic"
new_sqlite_classes = ["SiiFolioGuard"]
